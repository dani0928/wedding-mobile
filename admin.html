<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>사진 관리 · 박진혁 · 서하늘</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #fffdf7;
    --ivory-deep: #fbf6ea;
    --accent: #8ecae6;
    --accent-deep: #5fa8cc;
    --accent-soft: #e3f2fb;
    --ink: #3a352c;
    --ink-soft: #86807a;
    --border-soft: #e8e2d4;
    --danger: #e0645a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--ivory);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 18px 80px; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 20px; }

  /* Password gate */
  #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
  #gate h1 { font-size: 1.2rem; margin-bottom: 18px; }
  #gate input {
    width: 100%; max-width: 260px; padding: 12px 14px; border: 1.5px solid var(--border-soft);
    border-radius: 10px; font-size: 1rem; text-align: center; margin-bottom: 12px;
  }
  #gate input:focus { outline: none; border-color: var(--accent); }
  #gate button {
    width: 100%; max-width: 260px; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  #gate button:active { transform: scale(0.98); }
  #gateError { color: var(--danger); font-size: 0.82rem; margin-top: 10px; min-height: 1.2em; }

  #app { display: none; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .lock-btn { background: none; border: 1px solid var(--border-soft); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; color: var(--ink-soft); cursor: pointer; }

  .share-thumb-box {
    border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px;
    margin-bottom: 20px; background: #fff;
  }
  .share-thumb-hint { margin: 4px 0 0; font-size: 0.76rem; color: var(--ink-soft); line-height: 1.5; }
  .share-thumb-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .share-thumb-preview {
    width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
    background: var(--ivory-deep); flex-shrink: 0; visibility: hidden;
  }
  .upload-box {
    border: 2px dashed var(--border-soft); border-radius: 14px; padding: 22px 16px;
    text-align: center; margin-bottom: 26px; background: var(--ivory-deep);
  }
  .upload-box.drag { border-color: var(--accent); background: var(--accent-soft); }
  .upload-box p { margin: 0 0 12px; font-size: 0.85rem; color: var(--ink-soft); }
  .upload-btn {
    display: inline-block; background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 10px 22px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  #fileInput { display: none; }
  #uploadStatus { margin-top: 12px; font-size: 0.78rem; color: var(--accent-deep); min-height: 1.2em; }

  .section-label { font-size: 0.85rem; font-weight: 700; margin: 0 0 12px; color: var(--ink); }
  .photo-list { display: flex; flex-direction: column; gap: 10px; }
  .photo-card {
    display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 8px; position: relative;
  }
  .photo-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--ivory-deep); }
  .photo-meta { flex: 1; min-width: 0; }
  .photo-order { font-size: 0.72rem; color: var(--ink-soft); }
  .hero-badge {
    display: inline-block; margin-top: 3px; font-size: 0.68rem; font-weight: 700; color: var(--accent-deep);
    background: var(--accent-soft); border-radius: 6px; padding: 2px 6px;
  }
  .photo-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .icon-btn {
    border: 1px solid var(--border-soft); background: #fff; border-radius: 7px; width: 30px; height: 30px;
    font-size: 0.85rem; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.hero-set { color: var(--accent-deep); border-color: var(--accent); }
  .icon-btn.danger { color: var(--danger); border-color: #f1c9c5; }
  .empty-note { font-size: 0.82rem; color: var(--ink-soft); text-align: center; padding: 20px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink);
    color: #fff; font-size: 0.82rem; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1px solid var(--border-soft); }
  .tab-btn {
    background: none; border: none; padding: 10px 4px; font-size: 0.85rem; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--accent-deep); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .field-group input[type="text"], .field-group textarea, .field-group select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border-soft); border-radius: 8px;
    font-size: 0.88rem; font-family: inherit; color: var(--ink); background: #fff;
  }
  .field-group input:focus, .field-group textarea:focus, .field-group select:focus { outline: none; border-color: var(--accent); }
  .field-group textarea { min-height: 90px; resize: vertical; }
  .save-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  .save-btn:active { transform: scale(0.98); }

  .account-side-label { font-size: 0.85rem; font-weight: 700; margin: 22px 0 10px; color: var(--ink); }
  .account-side-label:first-of-type { margin-top: 0; }
  .account-card {
    background: #fff; border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .account-card .field-group { margin-bottom: 10px; }
  .account-card-row { display: flex; gap: 8px; }
  .account-card-row .field-group { flex: 1; }
  .account-card-actions { display: flex; gap: 8px; margin-top: 4px; }
  .account-card-actions button { flex: 1; padding: 9px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-soft); background: #fff; }
  .account-card-actions .save-account-btn { color: var(--accent-deep); border-color: var(--accent); }
  .account-card-actions .delete-account-btn { color: var(--danger); border-color: #f1c9c5; }
  .add-account-btn {
    width: 100%; padding: 10px; border: 1.5px dashed var(--border-soft); border-radius: 10px;
    background: none; color: var(--ink-soft); font-size: 0.82rem; cursor: pointer; margin-bottom: 24px;
  }

  .rsvp-stats {
    display: flex; align-items: center; gap: 18px; background: #fff; border: 1px solid var(--border-soft);
    border-radius: 14px; padding: 16px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .rsvp-donut-wrap { flex-shrink: 0; }
  .rsvp-donut {
    width: 92px; height: 92px; border-radius: 50%; position: relative;
    background: conic-gradient(var(--accent-deep) 0% var(--groom-pct, 0%), #f3c9d4 var(--groom-pct, 0%) 100%);
  }
  .rsvp-donut-center {
    position: absolute; inset: 12px; background: #fff; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .rsvp-donut-center span { font-size: 1.15rem; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .rsvp-donut-center small { font-size: 0.62rem; color: var(--ink-soft); margin-top: 2px; }
  .rsvp-stat-boxes { display: flex; gap: 10px; flex: 1; min-width: 160px; }
  .rsvp-stat-box {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--ivory-deep); border-radius: 10px; padding: 10px 8px;
  }
  .rsvp-stat-label { font-size: 0.72rem; font-weight: 600; color: var(--ink-soft); }
  .rsvp-stat-value { font-size: 1.3rem; font-weight: 700; color: var(--ink); }
  .rsvp-stat-groom .rsvp-stat-value { color: var(--accent-deep); }
  .rsvp-stat-bride .rsvp-stat-value { color: #d2789a; }
  .rsvp-stat-sub { font-size: 0.68rem; color: var(--ink-soft); }
  .rsvp-stat-note { width: 100%; margin: 0; font-size: 0.74rem; color: var(--ink-soft); }

  .admin-list { display: flex; flex-direction: column; gap: 10px; }
  .admin-list-card {
    display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 12px;
  }
  .admin-list-thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--ivory-deep); }
  .admin-list-main { flex: 1; min-width: 0; }
  .admin-list-title { margin: 0; font-size: 0.85rem; font-weight: 700; color: var(--ink); word-break: break-word; }
  .admin-list-tag {
    display: inline-block; margin-left: 6px; font-size: 0.68rem; font-weight: 600; color: var(--accent-deep);
    background: var(--accent-soft); border-radius: 6px; padding: 1px 6px;
  }
  .admin-list-sub { margin: 4px 0 0; font-size: 0.8rem; color: var(--ink); line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .admin-list-date { margin: 4px 0 0; font-size: 0.7rem; color: var(--ink-soft); }
</style>
</head>
<body>

<div id="gate">
  <h1>사진 관리자 페이지</h1>
  <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off" />
  <button id="pwSubmit">입장</button>
  <p id="gateError"></p>
</div>

<div id="app">
  <div class="wrap">
    <div class="toolbar">
      <div>
        <h1>청첩장 관리</h1>
        <p class="sub">여기서 바꾸면 사이트에 바로 반영됩니다</p>
      </div>
      <button class="lock-btn" id="lockBtn">잠그기</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="photos">사진</button>
      <button class="tab-btn" data-tab="content">문구</button>
      <button class="tab-btn" data-tab="accounts">계좌</button>
      <button class="tab-btn" data-tab="rsvp">참석의사</button>
      <button class="tab-btn" data-tab="guestbook">방명록</button>
      <button class="tab-btn" data-tab="snaps">게스트스냅</button>
    </div>

    <div class="tab-panel active" id="tab-photos">
      <div class="share-thumb-box">
        <p class="section-label">공유 썸네일 (카톡·링크 미리보기 전용)</p>
        <p class="share-thumb-hint">여기서 올리는 사진은 청첩장 갤러리에는 보이지 않고, 카카오톡이나 링크를 공유할 때 미리보기 이미지로만 사용됩니다.</p>
        <div class="share-thumb-row">
          <img id="shareThumbPreview" class="share-thumb-preview" alt="" />
          <label class="upload-btn" for="shareThumbInput">사진 선택</label>
          <input type="file" id="shareThumbInput" accept="image/*" hidden />
        </div>
        <p id="shareThumbStatus" class="share-thumb-hint"></p>
      </div>

      <div class="upload-box" id="uploadBox">
        <p>사진을 여기로 끌어놓거나 선택해서 업로드하세요</p>
        <label class="upload-btn" for="fileInput">사진 선택</label>
        <input type="file" id="fileInput" accept="image/*" multiple />
        <p id="uploadStatus"></p>
      </div>

      <p class="section-label">현재 사진 (⭐ = 대표사진)</p>
      <div class="photo-list" id="photoList"></div>
    </div>

    <div class="tab-panel" id="tab-content">
      <div class="field-group">
        <label for="cf-groom_name">신랑 이름</label>
        <input type="text" id="cf-groom_name" />
      </div>
      <div class="field-group">
        <label for="cf-bride_name">신부 이름</label>
        <input type="text" id="cf-bride_name" />
      </div>
      <div class="field-group">
        <label for="cf-groom_parents">신랑측 혼주 표기 (이름 앞부분)</label>
        <input type="text" id="cf-groom_parents" placeholder="예: 박창희 · 박선희의 장남" />
      </div>
      <div class="field-group">
        <label for="cf-bride_parents">신부측 혼주 표기 (이름 앞부분)</label>
        <input type="text" id="cf-bride_parents" placeholder="예: 이혜영의 장녀" />
      </div>
      <div class="field-group">
        <label for="cf-invitation_message">초대 인사말</label>
        <textarea id="cf-invitation_message"></textarea>
      </div>
      <div class="field-group">
        <label for="cf-invitation_signature">서명 문구</label>
        <input type="text" id="cf-invitation_signature" />
      </div>
      <div class="field-group">
        <label for="cf-wedding_datetime_text">예식 일시 문구</label>
        <input type="text" id="cf-wedding_datetime_text" placeholder="예: 2026년 10월 10일 토요일 오후 5시 50분" />
      </div>
      <div class="field-group">
        <label for="cf-venue_name">예식장 이름</label>
        <input type="text" id="cf-venue_name" />
      </div>
      <div class="field-group">
        <label for="cf-guest_snap_prize_note">게스트스냅 경품 안내 문구</label>
        <textarea id="cf-guest_snap_prize_note"></textarea>
      </div>
      <button class="save-btn" id="saveContentBtn">문구 저장</button>
    </div>

    <div class="tab-panel" id="tab-accounts">
      <p class="account-side-label">신랑측 계좌</p>
      <div id="groomAccountList"></div>
      <button class="add-account-btn" data-side="groom">+ 신랑측 계좌 추가</button>

      <p class="account-side-label">신부측 계좌</p>
      <div id="brideAccountList"></div>
      <button class="add-account-btn" data-side="bride">+ 신부측 계좌 추가</button>
    </div>

    <div class="tab-panel" id="tab-rsvp">
      <div class="rsvp-stats" id="rsvpStats">
        <div class="rsvp-donut-wrap">
          <div class="rsvp-donut" id="rsvpDonut" style="--groom-pct: 0%">
            <div class="rsvp-donut-center">
              <span id="rsvpTotalCount">0</span>
              <small>참석 인원</small>
            </div>
          </div>
        </div>
        <div class="rsvp-stat-boxes">
          <div class="rsvp-stat-box rsvp-stat-groom">
            <span class="rsvp-stat-label">신랑측</span>
            <span class="rsvp-stat-value" id="rsvpGroomCount">0</span>
            <span class="rsvp-stat-sub" id="rsvpGroomResponses">0건</span>
          </div>
          <div class="rsvp-stat-box rsvp-stat-bride">
            <span class="rsvp-stat-label">신부측</span>
            <span class="rsvp-stat-value" id="rsvpBrideCount">0</span>
            <span class="rsvp-stat-sub" id="rsvpBrideResponses">0건</span>
          </div>
        </div>
        <p class="rsvp-stat-note" id="rsvpNotComingNote"></p>
      </div>

      <p class="section-label">참석 의사 응답</p>
      <div class="admin-list" id="rsvpList"></div>
    </div>

    <div class="tab-panel" id="tab-guestbook">
      <p class="section-label">방명록 메시지</p>
      <div class="admin-list" id="guestbookAdminList"></div>
    </div>

    <div class="tab-panel" id="tab-snaps">
      <p class="section-label">게스트 스냅</p>
      <div class="admin-list" id="snapAdminList"></div>
    </div>
  </div>
</div>

<p class="toast" id="toast"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
